<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinnacle Growth Solutions</title>
<meta name="description" content="AI advisory for private equity firms and their portfolio companies. New website coming soon.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2325282D'/%3E%3Cg transform='translate(50 50) scale(0.62) translate(-50 -49.65)'%3E%3Cpath fill='%23F5F2EA' d='M50 15L90 84.3H10Z M50 31L23.8 76.3H76.2Z'/%3E%3Ccircle cx='50' cy='61' r='7' fill='%23B08A4E'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600&display=swap">
<style>
  :root { --charcoal:#25282D; --ivory:#F5F2EA; --brass:#C9A46A; --muted:#B5B0A6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    padding: clamp(24px, 5vw, 56px) clamp(16px, 5vw, 64px);
    background-color: var(--charcoal);
    background-image: linear-gradient(rgba(245,242,234,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(245,242,234,.06) 1px, transparent 1px);
    background-size: 64px 64px;
    color: var(--ivory); font-family: Manrope, "Helvetica Neue", Arial, sans-serif;
  }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 40px; padding: 48px 0; }
  .lockup { display: flex; align-items: center; gap: clamp(16px, 2.4vw, 28px); }
  .lockup svg { width: clamp(64px, 9vw, 104px); height: auto; display: block; }
  .words { display: flex; flex-direction: column; gap: clamp(8px, 1vw, 12px); text-align: left; }
  .pn { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: clamp(34px, 5.4vw, 64px); line-height: 1; letter-spacing: .2em; }
  .hr { height: 1px; background: rgba(245,242,234,.4); }
  .gs { font-size: clamp(10px, 1.2vw, 14px); font-weight: 500; line-height: 1; letter-spacing: .5em; white-space: nowrap; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .24em; color: var(--muted); }
  .intro { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 620px; }
  h1 { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; text-wrap: balance; }
  .contact { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 28px; border-top: 1px solid rgba(245,242,234,.2); min-width: min(320px, 100%); }
  .contact a { color: var(--ivory); font-size: clamp(17px, 2vw, 22px); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--brass); padding-bottom: 4px; word-break: break-all; }
  .contact a:hover { color: var(--brass); }
  a:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--charcoal), 0 0 0 4px var(--brass); }
  footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="lockup" role="img" aria-label="Pinnacle Growth Solutions">
    <svg viewBox="10 15 80 69.3" aria-hidden="true"><path fill="#F5F2EA" d="M50 15L90 84.3H10Z M50 31L23.8 76.3H76.2Z"/><circle cx="50" cy="61" r="7" fill="#C9A46A"/></svg>
    <div class="words"><span class="pn">PINNACLE</span><span class="hr"></span><span class="gs">GROWTH SOLUTIONS</span></div>
  </div>
  <div class="intro">
    <div class="eyebrow">NEW WEBSITE COMING SOON</div>
    <h1>AI advisory for private equity firms and their portfolio companies.</h1>
  </div>
  <div class="contact">
    <span class="eyebrow">CONTACT US</span>
    <a href="mailto:info@pinnaclegrowthsolutions.com">info@pinnaclegrowthsolutions.com</a>
  </div>
</main>
<footer>
  <span>© 2026 Pinnacle Growth Solutions LLC</span>
</footer>
</body>
</html>
